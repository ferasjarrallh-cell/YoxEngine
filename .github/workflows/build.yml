name: Build YoxEngine IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create App Bundle
        run: |
          mkdir -p build/YoxEngine.app
          cp -r * build/YoxEngine.app/ 2>/dev/null || true

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/YoxEngine.app Payload/
          zip -r YoxEngine.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoxEngine-IPA
          path: YoxEngine.ipa
