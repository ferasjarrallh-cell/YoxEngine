name: Build YoxEngine IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Valid App Bundle
        run: |
          mkdir -p YoxEngine.app
          cp -r * YoxEngine.app/ 2>/dev/null || true
          
          # إنشاء ملف Info.plist رئيسي لمنع كراش KSign
          cat << 'EOF' > YoxEngine.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>YoxEngine</string>
              <key>CFBundleIdentifier</key>
              <string>com.yox.engine</string>
              <key>CFBundleName</key>
              <string>YoxEngine</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

      - name: Pack Valid IPA
        run: |
          mkdir -p Payload
          cp -r YoxEngine.app Payload/
          zip -r YoxEngine.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoxEngine-IPA
          path: YoxEngine.ipa
