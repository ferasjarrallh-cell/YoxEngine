name: YoxEngine
options:
  bundleIdPrefix: com.yox
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.yox.engine
    INFOPLIST_GENERATION: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OBJC_BRIDGING_HEADER: YoxEngine-Bridging-Header.h
targets:
  YoxEngine:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: YoxEngine-Bridging-Header.h
        buildPhase: none
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Yox Engine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Yox Engine connects to your PC running Sunshine on your local network."
        INFOPLIST_KEY_NSBonjourServices:
          - "_sunshine._tcp"
